# interests.yaml — weighted interest keywords for relevance scoring
#
# Structure:
#   categories: top-level buckets with a daily cap (max items per day)
#   keywords: term → weight (1–10). Higher weight = stronger boost.
#   boost_phrases: multi-word phrases that give an extra signal boost
#   hype_penalties: terms that reduce score when too generic/repetitive

daily_cap: 10

categories:
  ai:
    cap: 3          # max 3 AI items per day
    weight: 1.4     # category multiplier
  swe:
    cap: 3
    weight: 1.3
  devops:
    cap: 2
    weight: 1.2
  security:
    cap: 2
    weight: 1.2
  podcast:
    cap: 2
    weight: 1.0
  news:
    cap: 3
    weight: 1.1

keywords:
  # ── AI / LLM / Agents ──────────────────────────────────────────────────
