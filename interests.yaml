boost_phrases:
  - "best coding models"
  - "top llm"
  - "new llm release"
  - "agentic coding"
  - "ai pair programmer"
  - "model benchmarks"
  - "open source llm"
  - "autonomous agent"
  - "platform engineer"
  - "zero day"
  - "critical vulnerability"
  - "supply chain"
  - "this week in tech"
  - "devops weekly"
  - "sre weekly"

hype_penalties:
  # Words that trigger a score reduction when the item is likely low-signal hype
  - "ai will replace"
  - "chatgpt is amazing"
  - "chatgpt can now"
  - "10x developer"
  - "hustle"
  - "web3"
  - "nft"
  - "blockchain" # unless paired with security/protocol terms
  - "crypto"
  - "metaverse"
  - "prompt engineering tips"   # too generic
  - "beginner guide to"
  - "ultimate guide to"
  - "everything you need to know"
