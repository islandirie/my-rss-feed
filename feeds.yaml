# feeds.yaml — all RSS/API sources for the daily digest pipeline
# Add or remove sources here. Keep it to ~15-25 high-signal feeds.
# Fields:
#   name: human-readable label
#   url: RSS/Atom feed URL (or "hn_api" / "youtube" for special sources)
#   type: rss | hn | youtube
#   category: one of [ai, devops, security, swe, podcast, news]
#   quality: 1-5 (source quality weight, higher = more trusted)
#   enabled: true/false (quick on/off without deleting)

sources:
  # ── Hacker News ──────────────────────────────────────────────────────────
  - name: "Hacker News – Best Stories"
    url: "https://hnrss.org/best"
    type: rss
    category: news
    quality: 5
    enabled: true

